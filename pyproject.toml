[build-system]
requires = ["scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "libxtm"
version = "0.1.0"
description = "Lossless terrain elevation compression library"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.urls]
Homepage = "https://github.com/yashwk/libxtm"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.define = { XTM_BUILD_PYTHON = "ON", BUILD_TESTING = "OFF" }
wheel.packages = []
wheel.exclude = ["bin/*", "include/*", "lib/*"]
wheel.py-api = "cp312"
